name: Sync upstream

on:
  schedule:
    # 16:00 UTC daily: 8:00am Pacific Standard Time, 9:00am Pacific Daylight Time.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge cursor/plugins main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains https://github.com/cursor/plugins main."
            exit 0
          fi
          if ! git merge --no-edit upstream/main -m "Merge upstream cursor/plugins main"; then
            echo "Merge conflicts with cursor/plugins main:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          git push origin HEAD:main
